[project]
name = "trans-ai-quiz-server"
version = "0.1.0"
description = "オンライン早押しクイズのバックエンド"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14",
    "python-dotenv>=1.0",
    "openai>=1.60",
    "anthropic>=0.69",
    "google-genai>=1.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# WebSocket のテストは受信待ちで固まりうるので、既定でタイムアウトさせる
timeout = 15

[tool.uv]
package = false
